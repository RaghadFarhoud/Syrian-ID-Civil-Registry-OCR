<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ID Relay</title>
<script src="config.js"></script>
<style>
  /* Palette sampled from logo.jpg: teal #032524 + gold #988461 */
  :root {
    --teal-950: #032524;
    --teal-900: #062d2c;
    --teal-800: #0b413f;
    --teal-700: #135856;
    --teal-600: #1e716e;
    --teal-500: #298e8b;
    --teal-300: #68cac7;
    --teal-200: #afdedd;
    --teal-100: #e4f1f0;
    --gold-500: #988461;
    --gold-400: #b1a081;
    --gold-300: #ccbda4;
    --gold-600: #7d6a4a;
    --line: #124b48;
    --muted: #8fb3b1;
  }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    width: 300px; padding: 14px; margin: 0;
    background: var(--teal-950);
    color: var(--teal-100);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brand img {
    width: 40px; height: 40px; border-radius: 10px; object-fit: cover;
    box-shadow: 0 0 0 1px var(--gold-600);
  }
  h3 { margin: 0 0 2px; font-size: 14px; color: var(--gold-300); }
  .brandtext { min-width: 0; }
  .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  .group { background: var(--teal-900); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .group h4 {
    margin: 0 0 8px; font-size: 12px; color: var(--gold-300);
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  label { display: block; font-size: 12px; font-weight: 600; margin: 8px 0 3px; color: var(--teal-200); }
  input[type="text"] {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line);
    border-radius: 7px; font-size: 12px; box-sizing: border-box;
    font-family: inherit; background: var(--teal-950); color: var(--teal-100);
  }
  input[type="text"]::placeholder { color: #6d908e; }
  input[type="text"]:focus { outline: 2px solid var(--gold-400); border-color: transparent; }
  .cb { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--teal-200); font-weight: 400; }
  .cb input { margin: 0; accent-color: var(--gold-500); }
  button {
    width: 100%; padding: 10px; border: 0; border-radius: 8px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: inherit; margin-top: 6px;
  }
  #sendBtn, #sendPrefixBtn { background: var(--gold-400); color: var(--teal-950); }
  #sendBtn:hover, #sendPrefixBtn:hover { background: var(--gold-300); }
  #saveBtn { background: transparent; color: var(--gold-300); border: 1px solid var(--gold-600); }
  #saveBtn:hover { background: rgba(152, 132, 97, .16); }
  button:disabled { background: #4b6b69 !important; color: #9cb8b6 !important; cursor: not-allowed; }
  .status { margin-top: 10px; font-size: 12px; line-height: 1.8; display: none; }
  .ok { color: var(--teal-300); } .bad { color: #f0a3a3; } .warn { color: var(--gold-300); }
  .saved { margin-top: 6px; font-size: 11px; color: var(--teal-300); display: none; }
</style>
</head>
<body>
  <div class="brand">
    <img src="logo.jpg" alt="">
    <div class="brandtext">
      <h3>ID Relay — ناقل البيانات</h3>
    </div>
  </div>
  <div class="sub">الإعدادات المحفوظة هنا تسري فوراً وتتجاوز الملف المجهز (.env). احفظ ثم أعد المحاولة.</div>

  <div class="group">
    <h4>إرسال</h4>
    <button id="sendBtn">أرسل آخر استخراج إلى التاب النشط الآن ⇦</button>
    <button id="sendPrefixBtn">أرسل حسب إعداد "عنوان الموقع" أدناه</button>
  </div>

  <div class="group">
    <h4>إعدادات (تُحفظ في هذا المتصفح)</h4>
    <label for="sBase">رابط الخادم المحلي (التطبيق)</label>
    <input type="text" id="sBase" placeholder="http://localhost:8000">
    <label for="sPrefix">بداية عنوان تاب الموقع (توضع بين التابات المفتوحة)</label>
    <input type="text" id="sPrefix" placeholder="https://portal.example.gov">
    <label class="cb" style="margin-top:8px;">
      <input type="checkbox" id="sOpen"> افتح التاب تلقائياً عند عدم وجوده
    </label>
    <label for="sOpenUrl">العنوان الذي يفتح عند الغياب</label>
    <input type="text" id="sOpenUrl" placeholder="https://portal.example.gov">
    <button id="saveBtn">حفظ الإعدادات</button>
    <div class="saved" id="savedMsg">✓ تم الحفظ. الإعدادات تسري الآن.</div>
  </div>

  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
